<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Generador QR</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#fff;border-radius:20px;box-shadow:0 8px 32px #0002;width:100%;max-width:480px;overflow:hidden;}
  .header{background:linear-gradient(135deg,#7c3aed,#4f46e5);padding:20px 24px;color:#fff;}
  .header h1{font-size:1.2rem;margin-bottom:2px;}
  .header p{font-size:.8rem;opacity:.75;}
  .body{padding:20px;}
  label{display:block;font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .section{margin-bottom:18px;}
  input[type=text], input[type=url]{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:.95rem;outline:none;transition:border .2s;}
  input[type=text]:focus, input[type=url]:focus{border-color:#7c3aed;}
  .search-wrap{position:relative;}
  .search-wrap input{padding-left:36px;}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1rem;}
  .dropdown{border:2px solid #e2e8f0;border-radius:12px;max-height:200px;overflow-y:auto;display:none;margin-top:4px;}
  .dropdown.open{display:block;}
  .dropdown-item{padding:10px 14px;cursor:pointer;font-size:.9rem;border-bottom:1px solid #f1f5f9;transition:background .15s;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover{background:#f5f3ff;}
  .dropdown-item.selected{background:#ede9fe;font-weight:700;color:#5b21b6;}
  .selected-badge{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700;margin-top:6px;}
  .row{display:flex;gap:10px;}
  .row .section{flex:1;}
  .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
  .btn:hover{opacity:.88;}
  .btn-primary{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;}
  .btn-outline{background:#f0fdf4;color:#16a34a;border:2px solid #86efac;}
  .btn-sm{padding:7px 14px;font-size:.8rem;border-radius:8px;border:none;cursor:pointer;font-weight:600;}
  .btn-auto{background:#f1f5f9;color:#475569;}
  .btn-edit{background:#ede9fe;color:#5b21b6;}
  .lote-row{display:flex;align-items:center;gap:8px;}
  .lote-display{flex:1;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-radius:12px;padding:10px 16px;font-size:1.1rem;font-weight:700;letter-spacing:.1em;}
  .lote-input{flex:1;font-size:1.1rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  #qr-section{text-align:center;display:none;}
  #qr-section.visible{display:block;}
  #qr-canvas-wrap{display:inline-block;background:#fff;padding:12px;border:2px solid #e2e8f0;border-radius:16px;margin:12px 0;}
  #qr-canvas-wrap canvas{display:block;}
  .content-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;text-align:left;margin-bottom:14px;}
  .content-box p{font-size:.8rem;color:#94a3b8;margin-bottom:4px;}
  .content-box pre{font-size:.8rem;font-family:monospace;color:#334155;white-space:pre-wrap;word-break:break-all;}
  .actions{display:flex;flex-direction:column;gap:10px;}
  .modal-bg{display:none;position:fixed;inset:0;background:#0006;z-index:100;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
  .modal-header{background:linear-gradient(135deg,#374151,#111827);color:#fff;padding:16px 20px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal-body{padding:20px;}
  .modal-body label{margin-top:14px;}
  .prod-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #e2e8f0;}
  .prod-item-row{display:flex;width:100%;gap:8px;}
  .prod-item input{flex:1;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;}
  .btn-del{background:#fee2e2;color:#ef4444;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem;font-weight:bold;}
  .btn-add-prod{background:#ede9fe;color:#5b21b6;border:none;border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
  .btn-save{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:12px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px;}
  .close-btn{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;line-height:1;}
  .no-results{padding:12px;text-align:center;color:#94a3b8;font-size:.85rem;}
</style>
</head>

      <div class="search-wrap">

        <input type="text" id="search-input" placeholder="Buscar producto..." oninput="filterProducts()" onfocus="openDropdown()" autocomplete="off"/>
      </div>
      <div class="dropdown" id="dropdown"></div>
      <div id="selected-product-badge" style="display:none;"></div>
    </div>

    <div class="section">
      <label>🔢 Número de lote</label>
      <div class="lote-row">
        <div class="lote-display" id="lote-display"></div>
        <input type="text" id="lote-input" class="lote-input" style="display:none;" onblur="finishEditLote()" onkeydown="if(event.key==='Enter')finishEditLote()"/>
        <button class="btn-sm btn-auto" onclick="resetLote()">Auto</button>
        <button class="btn-sm btn-edit" onclick="editLote()">Editar</button>
      </div>
    </div>

    <div class="section">
      <label>📅 Fecha</label>
      <button id="fecha-btn" class="btn btn-primary" onclick="toggleFecha()" style="text-align:left;padding:10px 16px;">
        <span id="fecha-icon">✅</span> Incluir fecha de hoy &nbsp;<span style="opacity:.7;font-size:.8rem;" id="fecha-val"></span>
      </button>
    </div>

    <div class="section">
      <label>👤 Operador</label>
      <input type="text" id="operador-input" placeholder="Nombre del operador..." oninput="renderQR()"/>
    </div>

    <div id="qr-section">
      <div class="content-box">
        <p>Contenido del QR</p>
        <pre id="qr-content-text"></pre>
      </div>
      <div id="qr-canvas-wrap">
        <canvas id="qr-canvas"></canvas>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="printLabel()">🖨️ Imprimir QR</button>
        <button class="btn btn-outline" id="url-btn" style="display:none;" onclick="openURL()">🌐 Ver ficha</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span>⚙️ Configuración de productos</span>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <label>Productos</label>
      <div id="prod-list"></div>
      <button class="btn-add-prod" onclick="addProductField()">+ Agregar producto</button>
      <button class="btn-save" onclick="saveSettings()">💾 Guardar cambios</button>
    </div>
  </div>
</div>

let products = [...PRODUCTOS_BASE];

let nextId = 500;

// ── Lote ──────────────────────────────────────────────────────────────────
function getWeek(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay()+6)%7);
  const w1 = new Date(date.getFullYear(),0,4);
  return 1 + Math.round(((date-w1)/86400000 - 3 + (w1.getDay()+6)%7)/7);
}
function autoLote() {
  const now = new Date();
  const letter = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[(now.getFullYear()-2008)%26];
  return letter + getWeek(now);
}
function resetLote() { lote = autoLote(); showLote(); renderQR(); }
function editLote() {
  document.getElementById("lote-display").style.display="none";
  const inp = document.getElementById("lote-input");
  inp.style.display="block"; inp.value=lote; inp.focus();
}
function finishEditLote() {
  const val = document.getElementById("lote-input").value.trim().toUpperCase();
  if(val) lote = val;
  document.getElementById("lote-input").style.display="none";
  showLote(); renderQR();
}
function showLote() { document.getElementById("lote-display").textContent = lote; }

// ── Fecha ─────────────────────────────────────────────────────────────────
function todayStr() {
  return new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function toggleFecha() {
  includeDate = !includeDate;
  const btn = document.getElementById("fecha-btn");
  document.getElementById("fecha-icon").textContent = includeDate ? "✅" : "⬜";
  btn.style.background = includeDate ? "linear-gradient(135deg,#7c3aed,#4f46e5)" : "#f1f5f9";
  btn.style.color = includeDate ? "#fff" : "#475569";
  renderQR();
}

// ── Dropdown ──────────────────────────────────────────────────────────────
function openDropdown() {
  filterProducts();
  document.getElementById("dropdown").classList.add("open");
}
document.addEventListener("click", e => {
  if(!e.target.closest(".search-wrap") && !e.target.closest(".dropdown"))
    document.getElementById("dropdown").classList.remove("open");
});
function filterProducts() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const dd = document.getElementById("dropdown");
  const filtered = products.filter(p => (p.label||"").toLowerCase().includes(q));
  if(filtered.length === 0) {
    dd.innerHTML = '<div class="no-results">Sin resultados</div>';
  } else {
    dd.innerHTML = filtered.map(p => `
      <div class="dropdown-item ${selectedProduct?.id===p.id?"selected":""}"
        onclick="selectProduct(${p.id})">
        ${p.label||"Sin nombre"}${p.url?` <span style="color:#16a34a;font-size:.85rem;float:right;">🔗</span>`:""}
      </div>`).join("");
  }
  dd.classList.add("open");
}
function selectProduct(id) {
  selectedProduct = products.find(p=>p.id===id);
  document.getElementById("search-input").value = selectedProduct.label;
  document.getElementById("dropdown").classList.remove("open");
  const badge = document.getElementById("selected-product-badge");
  badge.style.display="block";
  badge.innerHTML=`<span class="selected-badge">✓ ${selectedProduct.label}</span>`;
  document.getElementById("url-btn").style.display = selectedProduct.url ? "block" : "none";
  renderQR();
}

// ── QR ────────────────────────────────────────────────────────────────────
function buildQRData() {
  if(!selectedProduct) return "";
  const operador = document.getElementById("operador-input").value.trim();
  if(!selectedProduct.url) {
    return [
      `Producto: ${selectedProduct.label}`,
      `Lote: ${lote}`,
      includeDate ? `Fecha: ${todayStr()}` : null,
      operador ? `Operador: ${operador}` : null
    ].filter(Boolean).join("\n");
  }
  let base = selectedProduct.url.trim();
  if(!/^https?:\/\//i.test(base)) base = "https://" + base;
  const params = new URLSearchParams();
  params.set("producto", selectedProduct.label);
  params.set("lote", lote);
  if(includeDate) params.set("fecha", todayStr());
  if(operador)    params.set("operador", operador);
  const sep = base.includes("?") ? "&" : "?";
  return base + sep + params.toString();
}
function renderQR() {
  const data = buildQRData();
  const section = document.getElementById("qr-section");
  if(!data) { section.classList.remove("visible"); return; }
  document.getElementById("qr-content-text").textContent = data;
  const canvas = document.getElementById("qr-canvas");
  try {
    new QRious({ element:canvas, value:data, size:260, level:"M", background:"#ffffff", foreground:"#000000", padding:16 });
  } catch(e) { console.error(e); }
  section.classList.add("visible");
}

async function printLabel() {
  const canvas = document.getElementById("qr-canvas");
  const qrDataUrl = canvas.toDataURL("image/png");
  const logoDataUrl = await getLogoDataUrl();
  const producto = selectedProduct?.label || "";
  const loteVal  = lote || "";
  const fechaVal = includeDate ? todayStr() : "";
  const opVal    = document.getElementById("operador-input").value.trim();
  const enlace   = selectedProduct?.url || "";
  const logoHTML = logoDataUrl
    ? `<img class="logo" src="${logoDataUrl}" alt="Logo"/>`
    : `<div class="logo-placeholder">MONDRAGON</div>`;

  const html = `<!DOCTYPE html><html><head><title>Etiqueta</title>
  <style>
    @page { size: 48mm 102mm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #fff; color: #000; width: 48mm; height: 102mm; }
    .etiqueta { width: 48mm; height: 102mm; padding: 2.5mm 2mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .logo { width: 44mm; max-height: 18mm; object-fit: contain; }
    .logo-placeholder { font-size: 9pt; font-weight: bold; letter-spacing: 0.1em; text-align: center; }
    .divider { width: 100%; border: none; border-top: 0.4pt solid #000; }
    .qr-wrap { display: flex; justify-content: center; }
    .qr-wrap img { width: 36mm; height: 36mm; }
    .datos { width: 100%; display: flex; flex-direction: column; gap: 1mm; }
    .dato-row { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
    .dato-key { font-size: 6pt; color: #555; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; margin-right: 1.5mm; }
    .dato-val { font-size: 8pt; font-weight: bold; text-align: right; word-break: break-word; }
    .dato-val.lote { font-size: 10pt; letter-spacing: 0.08em; }
    .dato-producto { font-size: 8pt; font-weight: bold; text-align: center; line-height: 1.25; margin-bottom: 1mm; }
  </style></head><body>
  <div class="etiqueta">
    ${logoHTML}
    <hr class="divider"/>
    <div class="qr-wrap"><img src="${qrDataUrl}" alt="QR"/></div>
    <hr class="divider"/>
    <div class="datos">
      ${producto ? `<p class="dato-producto">${producto}</p>` : ""}
      ${loteVal ? `<div class="dato-row"><span class="dato-key">Lote</span><span class="dato-val lote">${loteVal}</span></div>` : ""}
      ${fechaVal ? `<div class="dato-row"><span class="dato-key">Fecha</span><span class="dato-val">${fechaVal}</span></div>` : ""}
      ${opVal ? `<div class="dato-row"><span class="dato-key">Operador</span><span class="dato-val">${opVal}</span></div>` : ""}
      ${enlace ? `<div class="dato-row"><span class="dato-key">Ficha</span><span class="dato-val" style="font-size:6pt;font-weight:normal;">${enlace}</span></div>` : ""}
    </div>
  </div>
  <script>window.onload=()=>{window.focus();window.print();}<\/script>
  </body></html>`;

  let iframe = document.getElementById("print-frame");
  if(!iframe){
    iframe = document.createElement("iframe");
    iframe.id = "print-frame";
    iframe.style.cssText = "position:fixed;width:0;height:0;border:none;left:-9999px;top:-9999px;";
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(()=>iframe.contentWindow.focus(), 300);
}

// ── Abrir URL ─────────────────────────────────────────────────────────────
function openURL() {
  if(!selectedProduct?.url) return;
  let link = selectedProduct.url.trim();
  if(!/^https?:\/\//i.test(link)) link = 'https://' + link;
  window.open(link, '_blank');
}

// ── Settings ──────────────────────────────────────────────────────────────
function openSettings() { renderProdList(); document.getElementById("modal").classList.add("open"); }
function closeSettings() { document.getElementById("modal").classList.remove("open"); }
function renderProdList() {
  document.getElementById("prod-list").innerHTML = products.map(p=>`
    <div class="prod-item" id="prod-${p.id}">
      <div class="prod-item-row">
        <input type="text" value="${p.label||''}" id="label-${p.id}" placeholder="Nombre del producto"/>
        <button class="btn-del" onclick="removeProd(${p.id})" title="Eliminar">✕</button>
      </div>
      <div class="prod-item-row">
        <input type="url" value="${p.url||''}" id="url-${p.id}" placeholder="https://ejemplo.com/ficha.pdf"/>
      </div>
    </div>`).join("");
}
function addProductField() {
  products.push({id:nextId++, label:"", url:""});
  renderProdList();
  document.querySelector('.modal-body').scrollTop = 999999;
}
function removeProd(id) {
  products = products.filter(p=>p.id!==id);
  if(selectedProduct?.id===id) {
    selectedProduct=null;
    document.getElementById("search-input").value="";
    document.getElementById("selected-product-badge").style.display="none";
    document.getElementById("url-btn").style.display="none";
    renderQR();
  }
  renderProdList();
}
function saveSettings() {
  products = products.map(p=>({
    ...p,
    label: document.getElementById("label-"+p.id)?.value.trim() || "Sin nombre",
    url:   document.getElementById("url-"+p.id)?.value.trim() || ""
  }));
  if(selectedProduct) {
    const updated = products.find(p=>p.id===selectedProduct.id);
    if(updated) { selectedProduct=updated; document.getElementById("search-input").value=updated.label; document.getElementById("url-btn").style.display=updated.url?"block":"none"; }
    else { selectedProduct=null; document.getElementById("search-input").value=""; document.getElementById("url-btn").style.display="none"; }
    renderQR();
  }
  closeSettings();
  filterProducts();
}

// ── Init ──────────────────────────────────────────────────────────────────
showLote();
document.getElementById("fecha-val").textContent = todayStr();
filterProducts();
</script>
